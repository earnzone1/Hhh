name: DubAI Studio — Build & Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          find . -maxdepth 1 -name "*.zip" | while read f; do
            mv "$f" ./project.zip
          done
          unzip -o ./project.zip -d ./project_extracted
          ls -la ./project_extracted/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper 9.3.1
        run: |
          cd ./project_extracted
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          export GRADLE_HOME=/tmp/gradle/gradle-9.3.1
          export PATH=$GRADLE_HOME/bin:$PATH
          gradle wrapper --gradle-version=9.3.1
          chmod +x gradlew
          echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Install Android SDK Components
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Create .env file
        run: |
          GEMINI_KEY="${{ secrets.GEMINI_API_KEY }}"
          if [ -z "$GEMINI_KEY" ]; then
            GEMINI_KEY="PLACEHOLDER_KEY"
          fi
          echo "GEMINI_API_KEY=$GEMINI_KEY" > ${{ env.PROJECT_DIR }}/.env

      - name: Generate Keystore
        run: |
          keytool -genkeypair \
            -keystore ${{ env.PROJECT_DIR }}/my-upload-key.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 9999 \
            -storepass android \
            -keypass android \
            -dname "CN=DubAI Studio, O=Example, C=US"

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleRelease --no-daemon
        env:
          GEMINI_API_KEY: PLACEHOLDER_KEY
          KEYSTORE_PATH: ${{ env.PROJECT_DIR }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find ${{ github.workspace }} -name "*.apk" -type f
          APK=$(find ${{ github.workspace }} -name "*.apk" -type f | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DubAI-Studio-Final-Release
          path: ${{ env.APK_PATH }}
          retention-days: 30
