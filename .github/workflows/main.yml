name: DubAI Studio — Build & Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK (for Whisper JNI)
        run: |
          echo "y" | sdkmanager "ndk;25.2.9519653"
          echo "y" | sdkmanager "cmake;3.22.1"

      - name: Grant Gradle Execute Permission
        run: chmod +x gradlew

      - name: Create .env file (Gemini API Key)
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Decode & Save Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/my-upload-key.jks

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DubAI-Studio-Pro-v1.0-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: DubAI-Studio-Pro-v1.0-release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "DubAI Studio Pro v1.0.0"
          body: |
            ## DubAI Studio Pro — Release v1.0.0
            AI-Powered Video Dubbing & Translation App
          files: "*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
