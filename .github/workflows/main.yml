name: DubAI Studio — Build & Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Project Root
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== Looking for gradlew ==="
          find . -name "gradlew" -type f
          find . -name "build.gradle.kts" -type f

      - name: Set Project Directory
        id: project_dir
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Gradle Execute Permission
        run: chmod +x ${{ env.PROJECT_DIR }}/gradlew

      - name: Create .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > ${{ env.PROJECT_DIR }}/.env

      - name: Decode & Save Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ env.PROJECT_DIR }}/my-upload-key.jks

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleRelease --no-daemon
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KEYSTORE_PATH: ${{ env.PROJECT_DIR }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DubAI-Studio-Pro-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          retention-days: 7
