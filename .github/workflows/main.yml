name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP file (if exists)
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ ! -z "$ZIP" ]; then
            echo "Found ZIP: $ZIP"
            unzip -q "$ZIP" -d temp_extract/
            if [ -d "temp_extract/app" ]; then
              cp -r temp_extract/* .
            else
              cp -r temp_extract/*/* .
            fi
            rm -rf temp_extract
          fi

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate gradlew if missing
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating from Gradle wrapper..."
            # Create wrapper script manually
            mkdir -p gradle/wrapper
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew
          ls -la ./gradlew

      - name: Create .env file from secrets
        run: |
          cat > .env << 'EOF'
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF
          # Verify .env was created
          [ -f .env ] && echo ".env file created successfully" || echo "ERROR: .env file not created"

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          ls -la debug.keystore

      - name: Verify Gradle configuration
        run: |
          echo "=== Gradle Properties ==="
          cat gradle.properties
          echo -e "\n=== Gradle Wrapper ==="
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Build Debug APK
        run: |
          ./gradlew clean assembleDebug \
            --stacktrace \
            --info \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

      - name: Check build output
        if: success()
        run: |
          find . -name "*.apk" -type f
          ls -lah app/build/outputs/apk/debug/

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build/
            app/build/
          retention-days: 7
          
