name: DubAI Studio — Build & Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          find . -maxdepth 1 -name "*.zip" | while read f; do
            mv "$f" ./project.zip
          done
          unzip -o ./project.zip -d ./project_extracted
          ls -la ./project_extracted/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper 9.3.1
        run: |
          cd ./project_extracted

          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          export GRADLE_HOME=/tmp/gradle/gradle-9.3.1
          export PATH=$GRADLE_HOME/bin:$PATH

          gradle wrapper --gradle-version=9.3.1
          chmod +x gradlew

          echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV

          echo "=== Gradle Version ==="
          ./gradlew --version

      - name: Install Android SDK Components
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Create .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > ${{ env.PROJECT_DIR }}/.env

      - name: Decode & Save Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ env.PROJECT_DIR }}/my-upload-key.jks

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KEYSTORE_PATH: ${{ env.PROJECT_DIR }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Find & Upload APK
        run: |
          echo "=== Searching APK ==="
          find ${{ github.workspace }} -name "*.apk" -type f

          APK_PATH=$(find ${{ github.workspace }} -name "*.apk" -type f | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DubAI-Studio-Pro-release
          path: ${{ env.APK_PATH }}
          retention-days: 30
