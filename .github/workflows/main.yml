name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP file (if exists)
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ ! -z "$ZIP" ]; then
            mkdir -p temp_extract
            unzip -q "$ZIP" -d temp_extract/
            INNER=$(find temp_extract -mindepth 1 -maxdepth 1 -type d | head -1)
            if [ -d "$INNER/app" ]; then SOURCE="$INNER"
            elif [ -d "temp_extract/app" ]; then SOURCE="temp_extract"
            else SOURCE="temp_extract"; fi
            cp -r "$SOURCE"/. .
            rm -rf temp_extract
          fi

      - name: Fix compileSdk DSL
        run: |
          python3 - <<'PYEOF'
          import re, pathlib
          f = pathlib.Path("app/build.gradle.kts")
          content = f.read_text()
          fixed = re.sub(r'compileSdk\s*\{[^}]*\}', 'compileSdk = 36', content)
          f.write_text(fixed)
          for line in fixed.splitlines():
              if "compileSdk" in line:
                  print(repr(line))
          PYEOF

      - name: Fix AGP, kotlin, ksp versions
        run: |
          python3 - <<'PYEOF'
          import pathlib, re
          f = pathlib.Path("gradle/libs.versions.toml")
          content = f.read_text()
          content = content.replace('agp = "9.1.1"', 'agp = "8.7.3"')
          content = content.replace('kotlin = "2.2.10"', 'kotlin = "2.1.0"')
          content = content.replace('googleDevtoolsKsp = "2.3.5"', 'googleDevtoolsKsp = "2.1.0-1.0.29"')
          f.write_text(content)
          g = pathlib.Path("gradle/wrapper/gradle-wrapper.properties")
          gc = g.read_text()
          gc = re.sub(r'gradle-[\d.]+-bin\.zip', 'gradle-8.10.2-bin.zip', gc)
          g.write_text(gc)
          print("Done")
          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download gradle-wrapper.jar and gradlew from GitHub
        # gradle wrapper command always reads project build files and fails.
        # Instead, download the real jar and script directly from Gradle's GitHub tag.
        run: |
          mkdir -p gradle/wrapper

          echo "Downloading gradle-wrapper.jar..."
          curl -sL \
            "https://raw.githubusercontent.com/gradle/gradle/refs/tags/v8.10.2/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          echo "Jar size: $(ls -lah gradle/wrapper/gradle-wrapper.jar)"

          echo "Downloading gradlew script..."
          curl -sL \
            "https://raw.githubusercontent.com/gradle/gradle/refs/tags/v8.10.2/gradlew" \
            -o gradlew
          chmod +x gradlew

          echo "=== First 5 lines of gradlew ==="
          head -5 gradlew
          echo "=== Wrapper jar check ==="
          file gradle/wrapper/gradle-wrapper.jar

      - name: Create placeholder google-services.json
        run: |
          if [ ! -f "app/google-services.json" ]; then
            cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder-project",
              "storage_bucket": "placeholder-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.videodubbing.kqzvpt"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "placeholder" }],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Create .env file from secrets
        run: |
          cat > .env << EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF

      - name: Ensure .env.example exists
        run: |
          if [ ! -f ".env.example" ]; then
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env.example
          fi

      - name: Install Android SDK platform 36
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" --sdk_root=$ANDROID_HOME

      - name: Create debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true

      - name: Verify all configs
        run: |
          echo "=== compileSdk ===" && grep "compileSdk" app/build.gradle.kts
          echo "=== versions ===" && grep -E "^agp|^kotlin|^googleDevtoolsKsp" gradle/libs.versions.toml
          echo "=== gradle wrapper ===" && cat gradle/wrapper/gradle-wrapper.properties
          echo "=== gradlew ===" && ls -lah gradlew
          echo "=== wrapper jar ===" && ls -lah gradle/wrapper/gradle-wrapper.jar

      - name: Build Debug APK
        run: |
          ./gradlew clean assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            2>&1 | tee build-output.log
          exit ${PIPESTATUS[0]}

      - name: Show build log tail on failure
        if: failure()
        run: tail -150 build-output.log

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: build-output.log
          retention-days: 7
