name: DubAI Studio — Build & Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find & Prepare Project
        run: |
          echo "=== Repo Structure ==="
          find . -maxdepth 3 -name "gradlew" -type f
          
          GRADLEW=$(find . -name "gradlew" -type f | head -1)
          
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found!"
            ls -la
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found gradlew at: $GRADLEW"
          echo "Project dir: $PROJECT_DIR"
          
          chmod +x "$GRADLEW"

      - name: Create .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > ${{ env.PROJECT_DIR }}/.env

      - name: Decode & Save Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ env.PROJECT_DIR }}/my-upload-key.jks

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KEYSTORE_PATH: ${{ env.PROJECT_DIR }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DubAI-Studio-Pro-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          retention-days: 7
