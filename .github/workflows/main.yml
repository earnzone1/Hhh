name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP file (if exists)
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ ! -z "$ZIP" ]; then
            echo "Found ZIP: $ZIP"
            unzip -q "$ZIP" -d temp_extract/
            # Copy contents properly
            if [ -d "temp_extract/app" ]; then
              cp -r temp_extract/* .
            else
              cp -r temp_extract/*/* .
            fi
            rm -rf temp_extract
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create .env file
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Make gradlew executable
        run: chmod +x ./gradlew || true

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
