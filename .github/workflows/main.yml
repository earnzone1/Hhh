name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP file (if exists)
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ ! -z "$ZIP" ]; then
            mkdir -p temp_extract
            unzip -q "$ZIP" -d temp_extract/

            # Detect nesting: does temp_extract contain a single subdirectory with app/?
            INNER=$(find temp_extract -mindepth 1 -maxdepth 1 -type d | head -1)
            if [ -d "$INNER/app" ]; then
              SOURCE="$INNER"
            elif [ -d "temp_extract/app" ]; then
              SOURCE="temp_extract"
            else
              SOURCE="temp_extract"
            fi

            # Copy everything including dotfiles
            cp -r "$SOURCE"/. .
            rm -rf temp_extract
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Patch compileSdk DSL incompatibility
        # The AI Studio project uses compileSdk { version = release(36) { ... } }
        # which is an experimental DSL not supported outside AI Studio.
        # Replace it with the standard integer form: compileSdk = 36
        run: |
          sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 36/' app/build.gradle.kts
          echo "=== compileSdk line after patch ==="
          grep "compileSdk" app/build.gradle.kts

      - name: Create placeholder google-services.json
        # Prevents google-services plugin from failing the build.
        # Replace this with a real google-services.json secret if you use Firebase features.
        run: |
          if [ ! -f "app/google-services.json" ]; then
            cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder-project",
              "storage_bucket": "placeholder-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.videodubbing.kqzvpt"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "placeholder" }],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Create .env file from secrets
        run: |
          cat > .env << 'EOF'
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF

      - name: Ensure .env.example exists
        # Required by the Secrets Gradle Plugin as defaultPropertiesFileName
        run: |
          if [ ! -f ".env.example" ]; then
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env.example
          fi

      - name: Install Android SDK platform 36
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" --sdk_root=$ANDROID_HOME

      - name: Generate gradlew if missing
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: Create debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true

      - name: Verify configuration
        run: |
          echo "=== Java Version ==="
          java -version
          echo -e "\n=== Gradle Wrapper ==="
          cat gradle/wrapper/gradle-wrapper.properties
          echo -e "\n=== .env.example ==="
          cat .env.example
          echo -e "\n=== compileSdk check ==="
          grep "compileSdk" app/build.gradle.kts

      - name: Build Debug APK
        run: |
          ./gradlew clean assembleDebug \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

      - name: Check build output
        if: success()
        run: |
          find . -name "*.apk" -type f
          ls -lah app/build/outputs/apk/debug/

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build/
            app/build/
          retention-days: 7
